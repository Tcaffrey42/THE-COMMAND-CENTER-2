<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommandCenter USA Map Standalone Test</title><style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#09090b;--muted:#71717a;--line:#e4e4e7}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:22px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.045)}.muted{color:#71717a}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950;border:1px solid}.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.amber{background:#fffbeb;color:#b45309;border-color:#fde68a}.green{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.tile{border:1px solid var(--line);background:#fafafa;border-radius:20px;padding:16px;margin:10px 0}.toast{position:fixed;right:18px;bottom:18px;background:#09090b;color:white;padding:14px 16px;border-radius:18px;font-weight:950;display:none}


/* SAFE USA MAP MODULE - isolated Heat Map styling only */
.usaMapShell{display:grid;grid-template-columns:1.65fr .9fr;gap:16px;align-items:stretch}
.usaMapWrap{background:linear-gradient(180deg,#f8fafc,#eef2ff);border:1px solid var(--line);border-radius:24px;padding:14px;min-height:430px;position:relative;overflow:hidden}
.usaMapWrap svg{width:100%;height:430px;display:block}
.usaLand{fill:#ffffff;stroke:#0f172a;stroke-width:2.4;filter:drop-shadow(0 14px 28px rgba(15,23,42,.12))}
.usaStateLine{stroke:#cbd5e1;stroke-width:1.2;fill:none;opacity:.9}
.usaWaterLabel{font-size:12px;font-weight:900;letter-spacing:1.5px;fill:#64748b;text-transform:uppercase}
.usaPin{cursor:pointer;stroke:#fff;stroke-width:4;filter:drop-shadow(0 7px 10px rgba(0,0,0,.28));transition:transform .15s ease,filter .15s ease}
.usaPin:hover{transform:scale(1.18);filter:drop-shadow(0 11px 16px rgba(0,0,0,.35))}
.usaPinCritical{fill:#dc2626}.usaPinHigh{fill:#f97316}.usaPinMedium{fill:#d97706}.usaPinLow{fill:#16a34a}
.usaPinLabel{font-size:12px;font-weight:950;fill:#0f172a;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round;pointer-events:none}
.usaLegend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.usaLegend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:950;color:#334155}.usaLegend i{width:11px;height:11px;border-radius:999px;display:inline-block}
.usaRiskPanel{display:grid;gap:10px}.usaRiskCard{border:1px solid var(--line);border-radius:18px;background:#fafafa;padding:13px;cursor:pointer}.usaRiskCard:hover{background:#fff;box-shadow:0 10px 25px rgba(0,0,0,.06)}
.usaRiskMeta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:7px;color:#71717a;font-size:12px;font-weight:850}
@media(max-width:1100px){.usaMapShell{grid-template-columns:1fr}.usaMapWrap svg{height:360px}.usaMapWrap{min-height:360px}}

</style></head><body><div id="heatmap"></div><div id="toast" class="toast"></div><script>
const db={locations:[
{id:"L101",site:"Charlotte Branch 014",region:"Southeast",risk:"High",trade:"HVAC",spend:48200,open:7,repeat:4,capex:true},
{id:"L205",site:"Dallas Branch 088",region:"Texas",risk:"Medium",trade:"Electrical",spend:37100,open:5,repeat:2,capex:false},
{id:"L319",site:"Phoenix Branch 122",region:"West",risk:"High",trade:"Plumbing",spend:61200,open:9,repeat:5,capex:true},
{id:"L522",site:"Cleveland Branch 207",region:"Midwest",risk:"Critical",trade:"HVAC",spend:87500,open:11,repeat:7,capex:true},
{id:"FG-PDX",site:"Portland OR Refresh",region:"West",risk:"High",trade:"Refresh",spend:420000,open:18,repeat:0,capex:true},
{id:"PC-118",site:"Atlanta Retail 118",region:"Southeast",risk:"Medium",trade:"Doors/Locks",spend:55200,open:8,repeat:3,capex:false}
]};
const x={ls:db.locations};
const money=n=>Number(n||0).toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
function pill(v){let cls=["Critical","Emergency","Breached","Pressure","At Risk","High"].includes(v)?"red":["Medium","Urgent","Pending","Review","Draft","Watch","Onboarding"].includes(v)?"amber":["Approved","Closed","Strong","Verified","On Track","Active","Stable"].includes(v)?"green":"blue";return `<span class="pill ${cls}">${v}</span>`}
function riskScore(l){return Math.round((l.open*6)+(l.repeat*14)+(l.spend/2000)+(l.capex?15:0))}
function toast(m){let t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function locationModal(id){const l=db.locations.find(x=>x.id===id); toast(l.site+" opened");}
function renderHeatMap(x){
 const coords={
  "L101":{x:720,y:345,city:"Charlotte, NC"},
  "L205":{x:505,y:390,city:"Dallas, TX"},
  "L319":{x:285,y:365,city:"Phoenix, AZ"},
  "L522":{x:675,y:250,city:"Cleveland, OH"},
  "FG-PDX":{x:175,y:165,city:"Portland, OR"},
  "PC-118":{x:690,y:385,city:"Atlanta, GA"}
 };
 const regionFallback={"West":{x:230,y:300},"Texas":{x:500,y:390},"Southeast":{x:700,y:370},"Midwest":{x:620,y:250},"Northeast":{x:790,y:210},"Pacific Northwest":{x:175,y:165}};
 const sorted=[...x.ls].sort((a,b)=>riskScore(b)-riskScore(a));
 const riskClass=l=>l.risk==="Critical"?"usaPinCritical":l.risk==="High"?"usaPinHigh":l.risk==="Medium"?"usaPinMedium":"usaPinLow";
 const pin=l=>{const p=coords[l.id]||regionFallback[l.region]||{x:500,y:300};const score=riskScore(l);return `<g onclick="locationModal('${l.id}')"><title>${l.site} · ${l.region} · Risk ${score}</title><circle class="usaPin ${riskClass(l)}" cx="${p.x}" cy="${p.y}" r="13"></circle><text class="usaPinLabel" x="${p.x+17}" y="${p.y+5}">${l.id}</text></g>`};
 heatmap.innerHTML=`<div class="card"><h3>USA Portfolio Heat Map</h3><p class="muted">Real map-style portfolio view. Pins are clickable and open the existing location detail workflow.</p>
 <div class="usaMapShell">
  <div class="usaMapWrap">
   <svg viewBox="0 0 1000 560" role="img" aria-label="USA portfolio heat map">
    <rect x="0" y="0" width="1000" height="560" rx="24" fill="transparent"></rect>
    <text class="usaWaterLabel" x="40" y="515">Pacific</text><text class="usaWaterLabel" x="850" y="515">Atlantic</text>
    <path class="usaLand" d="M135 178 L205 135 L300 128 L392 115 L500 132 L595 120 L690 142 L770 170 L832 215 L862 272 L846 327 L885 390 L830 430 L760 416 L705 455 L628 442 L568 470 L505 448 L445 462 L388 430 L318 445 L255 410 L205 392 L178 332 L140 305 L122 245 Z"></path>
    <path class="usaStateLine" d="M235 145 L245 410 M335 130 L325 445 M430 122 L425 458 M525 128 L520 450 M620 125 L610 440 M710 145 L700 445 M790 185 L760 416 M155 245 L860 272 M175 330 L845 327 M250 410 L820 425"></path>
    <path class="usaStateLine" d="M135 178 C210 205 270 215 340 198 C430 176 505 198 590 188 C690 176 770 206 832 215"></path>
    ${sorted.map(pin).join("")}
   </svg>
   <div class="usaLegend"><span><i style="background:#dc2626"></i>Critical</span><span><i style="background:#f97316"></i>High</span><span><i style="background:#d97706"></i>Medium</span><span><i style="background:#16a34a"></i>Stable</span></div>
  </div>
  <div class="usaRiskPanel">
   <div class="tile"><b>Portfolio Risk Stack Rank</b><p class="muted">Sorted by open WO, repeat issues, spend, and CAPEX flag.</p></div>
   ${sorted.map((l,i)=>`<div class="usaRiskCard" onclick="locationModal('${l.id}')"><div><b>${i+1}. ${l.site}</b><div class="muted">${l.region} · ${l.trade}</div></div><div class="usaRiskMeta"><span>${pill(l.risk)}</span><span>Risk ${riskScore(l)}</span></div><div class="usaRiskMeta"><span>${l.open} open</span><span>${l.repeat} repeat</span><span>${money(l.spend)}</span></div></div>`).join("")}
  </div>
 </div></div>`;
}
renderHeatMap(x);
</script></body></html>
